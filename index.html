<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labour Econ Midterm Practice</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2a26;--mute:#66756f;--line:#d5dcd8;--acc:#1f6b5a;--ok:#2e7d4f;--okbg:#e3f3e8;--bad:#b3392f;--badbg:#f9e4e1}
@media(prefers-color-scheme:dark){:root{--bg:#121917;--card:#1b2522;--ink:#e6eeea;--mute:#93a39c;--line:#2f3d38;--acc:#5fc2a8;--ok:#6fcf93;--okbg:#1c3a2a;--bad:#ef8a80;--badbg:#3d2220}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Iowan Old Style",serif}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0 10px}
.tag{font:600 13px system-ui,sans-serif;color:var(--acc)}
button{font:600 15px system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-height:44px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:20px;line-height:1.35;margin:6px 0 16px;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:16px/1.4 Georgia,serif;margin:0 0 10px;padding:13px 14px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:12px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--bg);font-size:16px}
nav{display:flex;gap:10px;margin-top:14px}
nav button{flex:1}
#go{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#grid{display:none;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
#grid.on{display:grid}
#grid button{padding:10px 0;min-height:44px}
#grid .cur{outline:3px solid var(--acc)}
#grid .r{background:var(--okbg)}#grid .w{background:var(--badbg)}
.jump{display:none;gap:8px;margin-bottom:10px}.jump.on{display:flex}
.jump input{flex:1;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
small{color:var(--mute);font-family:system-ui,sans-serif}
</style>
</head>
<body>
<main>
<header>
<button id="menu" aria-expanded="false">Jump to…</button>
<span class="tag" id="score"></span>
</header>
<div class="jump" id="jump"><input id="num" type="number" inputmode="numeric" min="1" placeholder="Question number"><button id="jgo">Go</button></div>
<div id="grid"></div>
<section class="card" aria-live="polite">
<div class="tag" id="meta"></div>
<h1 id="q"></h1>
<div id="opts"></div>
<div id="exp"></div>
</section>
<nav><button id="prev">Back</button><button id="next" id2="n">Next</button></nav>
<p><small>Progress is not saved. Refreshing resets answers, and the question list keeps its order.</small></p>
</main>

// Fixed-seed shuffle: answer positions vary but stay the same on every visit
let seed=7;const rnd=()=>(seed=(seed*1103515245+12345)%2147483648)/2147483648;
Q.forEach(x=>{const right=x[2][x[3]];for(let k=3;k>0;k--){const j=Math.floor(rnd()*(k+1));[x[2][k],x[2][j]]=[x[2][j],x[2][k]];}x[3]=x[2].indexOf(right);});
const el=id=>document.getElementById(id);
let i=0;const ans={};
function render(){
const [t,q,o,c,e]=Q[i],a=ans[i];
el('meta').textContent=`Question ${i+1} of ${Q.length} · ${t}`;
el('q').textContent=q;
el('opts').innerHTML='';
o.forEach((txt,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=txt;
if(a!==undefined){b.disabled=true;if(k===c)b.classList.add('right');else if(k===a)b.classList.add('wrong');}
b.onclick=()=>{ans[i]=k;render();};el('opts').appendChild(b);});
el('exp').innerHTML=a===undefined?'':`<div class="exp">${a===c?'Correct. ':'Not quite. '}${e}</div>`;
const n=Object.keys(ans).length,r=Object.keys(ans).filter(k=>ans[k]===Q[k][3]).length;
el('score').textContent=`${r}/${n} correct`;
el('prev').disabled=i===0;el('next').disabled=i===Q.length-1;
grid();
}
function grid(){const g=el('grid');g.innerHTML='';
Q.forEach((_,k)=>{const b=document.createElement('button');b.textContent=k+1;
if(k===i)b.classList.add('cur');
if(ans[k]!==undefined)b.classList.add(ans[k]===Q[k][3]?'r':'w');
b.onclick=()=>{i=k;toggle(false);render();window.scrollTo(0,0);};g.appendChild(b);});}
function toggle(on){el('grid').classList.toggle('on',on);el('jump').classList.toggle('on',on);el('menu').setAttribute('aria-expanded',on);}
el('menu').onclick=()=>toggle(!el('grid').classList.contains('on'));
el('jgo').onclick=()=>{const v=parseInt(el('num').value,10);if(v>=1&&v<=Q.length){i=v-1;toggle(false);render();el('num').value='';}};
el('prev').onclick=()=>{if(i>0){i--;render();window.scrollTo(0,0);}};
el('next').onclick=()=>{if(i<Q.length-1){i++;render();window.scrollTo(0,0);}};
render();
</script>
</body>
</html>
